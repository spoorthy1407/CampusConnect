spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1466
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

app.allowed-email-domain=
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173
app.upload-dir=uploads
app.print-dir=print-uploads
app.super-admin.name=Campus Admin
app.super-admin.email=${APP_SUPER_ADMIN_EMAIL:admin@campus.edu}
app.super-admin.password=${ADMIN_PASSWORD}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

print.price.bw=2
print.price.color=10
print.price.a3-multiplier=2
print.max-files=10

razorpay.key-id=
razorpay.key-secret=

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}